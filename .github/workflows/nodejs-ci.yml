name: Library Management CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate JSON Database
        run: npm run validate:json

      - name: Check Server Syntax
        run: node --check server.js

      - name: Check Seed Syntax
        run: node --check seed.js

      - name: Pipeline Success
        run: echo "Library Management CI completed successfully on AWS EC2"
